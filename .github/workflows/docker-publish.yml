name: Publish Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'WReisLab React Template' }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:3000' }}
            VITE_OIDC_AUTHORITY=${{ vars.VITE_OIDC_AUTHORITY || 'https://auth.wreislab.com' }}
            VITE_OIDC_CLIENT_ID=${{ vars.VITE_OIDC_CLIENT_ID || 'wreislab-react-template' }}
            VITE_OIDC_REDIRECT_URI=${{ vars.VITE_OIDC_REDIRECT_URI || 'http://localhost:5173/auth/callback' }}
            VITE_OIDC_POST_LOGOUT_REDIRECT_URI=${{ vars.VITE_OIDC_POST_LOGOUT_REDIRECT_URI || 'http://localhost:5173' }}
            VITE_OIDC_SCOPE=${{ vars.VITE_OIDC_SCOPE || 'openid profile email groups' }}
            VITE_OIDC_RESPONSE_TYPE=${{ vars.VITE_OIDC_RESPONSE_TYPE || 'code' }}
            VITE_JWT_GROUPS_CLAIM=${{ vars.VITE_JWT_GROUPS_CLAIM || 'groups' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
