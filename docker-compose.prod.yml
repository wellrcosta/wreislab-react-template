services:
  template-react:
    image: ghcr.io/wellrcosta/wreislab-react-template:latest
    restart: unless-stopped
    environment:
      - VITE_APP_NAME
      - VITE_API_BASE_URL
      - VITE_OIDC_AUTHORITY
      - VITE_OIDC_CLIENT_ID
      - VITE_OIDC_REDIRECT_URI
      - VITE_OIDC_POST_LOGOUT_REDIRECT_URI
      - VITE_OIDC_SCOPE
      - VITE_OIDC_RESPONSE_TYPE
      - VITE_JWT_GROUPS_CLAIM
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 2
      start_period: 10s
