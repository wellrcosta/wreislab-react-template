version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-WReisLab React Template}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-https://auth.wreislab.com}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-wreislab-react-template}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-http://localhost:5173/auth/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-http://localhost:5173}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email groups}
        VITE_OIDC_RESPONSE_TYPE: ${VITE_OIDC_RESPONSE_TYPE:-code}
        VITE_JWT_GROUPS_CLAIM: ${VITE_JWT_GROUPS_CLAIM:-groups}
    ports:
      - "80:80"
    restart: unless-stopped
